name: Deploy PHOTO-TEXTE production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photo-texte-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 2ea670c2a6ff28e248ef084adf095e8b
      PROD_URL: https://phototexte.noema-learn.uk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.5
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Check types
        run: npx tsc --noEmit

      - name: Deploy production Worker
        run: npm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify production deployment
        run: |
          login_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' "$PROD_URL/login")
          auth_status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 --output /dev/null --write-out '%{http_code}' "$PROD_URL/api/me")
          test "$login_status" = "200"
          test "$auth_status" = "403"
