name: Deploy Cloudflare dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photo-texte-cloudflare-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 2ea670c2a6ff28e248ef084adf095e8b
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEV_URL: https://photo-texte-dev.mani1261790.workers.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Check types
        run: npx tsc --noEmit

      - name: Deploy dev Worker
        run: npm run cf:deploy:dev

      - name: Verify dev deployment
        run: |
          login_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$DEV_URL/login")
          auth_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$DEV_URL/api/me")
          test "$login_status" = "200"
          test "$auth_status" = "403"
